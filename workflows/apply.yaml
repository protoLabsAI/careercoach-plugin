# The autonomous "apply" pipeline (ADR 0002 — static-DAG workflow). The coach's
# "do it for me" mode: given a posting, a small crew of this plugin's subagents
# research the company, score fit against the rubric, and build and save an apply kit for the operator. Run it:
#   run_workflow("apply", {"posting": "<url or pasted text>"})
# Steps are chained via `depends_on`; each step's output feeds the next through
# {{steps.<id>.output}} templating. Every step is a configured subagent (the engine
# only runs subagent steps) — the crew is registered in __init__.py and pulls the full
# discipline from the apply skill via load_skill.
name: apply
description: >-
  Evaluate a job posting and, if it's a fit, build and save an apply kit — the
  Career Coach's end-to-end application pipeline (research → evaluate → kit → handoff).
version: 1
inputs:
  - name: posting
    description: The job posting — a URL or the pasted text.
    required: true

steps:
  # 1. Sourced company brief.
  - id: research
    subagent: company_researcher
    prompt: |
      Research the company behind this job posting and return a sourced brief
      (mission, recent news, employee sentiment, team, red/green flags):

      {{inputs.posting}}

  # 2. Score fit against the rubric, using the research for the culture/career dimensions.
  - id: evaluate
    subagent: job_evaluator
    depends_on: [research]
    prompt: |
      Evaluate fit for this posting using the job-evaluation rubric. Use the company
      research for the behavioral/culture and career-alignment dimensions. Output the full
      evaluation (table, weighted overall, verdict, strengths, gaps, recommendation) and
      track it.

      POSTING:
      {{inputs.posting}}

      COMPANY RESEARCH:
      {{steps.research.output}}

  # 3. Build and save the apply kit, then hand off to the operator.
  - id: write
    subagent: application_writer
    depends_on: [evaluate, research]
    prompt: |
      Load the apply skill and follow its default apply kit flow. Using the evaluation
      and company research below, build a tailored résumé PDF with careercoach_render_resume
      → browser_open (the local file:// URL only) → browser_pdf. Use only operator-approved
      résumé wording and confirmed profile facts. This run has no operator in the loop, so you
      never confirm an answer or change the saved profile — leave both to the operator in the
      Career Coach view.
      Write a cover letter ONLY if the posting asks for one, following the writing-style
      discipline and honesty test. Verify every company-specific claim against research sources.
      If the verdict was Weak or Poor Fit, say so and stop rather than forcing a draft.
      Then collect every form answer using your granted standard-answers read tool,
      careercoach_read_sources(source='answers'); keep drafts as drafts and ask the
      operator about new or missing questions. If operator input is unavailable, report the
      pending questions without inventing answers or claiming the kit is complete.
      Only THEN call careercoach_save_apply_kit with all three together: resume_path=the returned
      PDF path, cover_letter=letter text, answers_json=a question-to-answer object/dict or JSON string
      (not the answer-bank report). Include resume_version if known; kit answers are stored as drafts.
      When no letter is requested, clear any stale letter with cover_letter="" and
      cover_letter_needed=false. Set no_form_questions=true only when there genuinely are no form questions.
      If the reply says DRAFT, fill in the listed missing parts and save again with all three;
      report any blocker requiring operator input without claiming completion. Check save success.
      Hand off: open the role in the Career Coach view, review drafts, attach the PDF, use the
      copy buttons to complete the application, then press Mark applied after submitting it.
      Do not drive the employer's form or mark the role applied. Nothing auto-submits.
      Report the verification checklist and any blockers.

      POSTING:
      {{inputs.posting}}

      EVALUATION:
      {{steps.evaluate.output}}

      COMPANY RESEARCH:
      {{steps.research.output}}

output: |
  # Application pack

  ## Fit evaluation
  {{steps.evaluate.output}}

  ## Apply kit and operator handoff
  {{steps.write.output}}

  ---
  Next: open the role in the Career Coach view, use the apply kit copy buttons, attach the PDF, and press Mark applied after submitting the application yourself.
