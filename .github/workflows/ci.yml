name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    # The org's Namespace Linux profile; override NSC_RUNNER on a fork that lacks it.
    runs-on: ${{ vars.NSC_RUNNER || 'namespace-profile-protolabs-linux' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # ruff is PINNED, like the other plugin repos: an unpinned install once resolved a newer
      # ruff whose default rules flagged code this version passes, and the job failed before
      # pytest ran. Bump it deliberately, and run the same version locally.
      - run: pip install -r requirements-dev.txt ruff==0.15.10
      - run: ruff check . && ruff format --check .
      - run: pytest -q
