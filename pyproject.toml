[project]
name = "careercoach"
version = "0.15.0"            # keep in lockstep with protoagent.plugin.yaml
requires-python = ">=3.11"
# No [project.dependencies] on purpose: this is a protoAgent plugin, loaded INTO the host, which
# provides langchain / langchain-core / langgraph / fastapi / httpx at its own pinned versions.
# Declaring them here would let an installer resolve them against the host's pins. The suite gets
# them from requirements-dev.txt (pinned to protoAgent's uv.lock). It isn't a standalone package.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# asyncio_mode = "auto"     # uncomment with pytest-asyncio for async tests

[tool.ruff]
line-length = 120
target-version = "py311"
