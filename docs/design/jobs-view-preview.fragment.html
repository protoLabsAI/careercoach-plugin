<script id="s-data">
/* Invented demo data only: seeded, so every reload is identical. */
var SEED = 7; function rnd() { SEED = (SEED * 16807) % 2147483647; return (SEED - 1) / 2147483646; }
function pick(a) { return a[Math.floor(rnd() * a.length)]; }
var CO = ['Northwind Labs','Lumen Grid','Quarry Systems','Fernbank AI','Halcyon Data','Brightwater','Copperline','Tessellate','Orchard Cloud','Pinecrest Health','Vantage Rail','Kestrel Robotics','Moonrise Media','Driftwood Pay','Saltmarsh Bio','Ironleaf','Bluefin Logistics','Arcadia Learning','Nimbus Ops','Granite Security'];
var MATCH = ['Staff Platform Engineer','Senior Platform Engineer','Staff Infrastructure Engineer','Senior Site Reliability Engineer','Staff Backend Engineer, Platform','Senior DevEx Engineer'];
var MISS = ['Engineering Manager, Payments','Data Scientist II','Solutions Architect','Product Designer','Technical Program Manager','Sales Engineer'];
var HOUR = 3600e3, DAY = 24 * HOUR, NOW = Date.now();
function iso(ms) { return new Date(ms).toISOString().slice(0, 10); }
var INBOX = [];
// 49 rows: 7 found in the last day, 21 this week, 12 older (all title matches, score 100); 9 title misses (score 0)
[[7, 0, 20], [21, 26, 160], [12, 170, 600]].forEach(function (b) {
  for (var i = 0; i < b[0]; i++) INBOX.push({ score: 100, title: pick(MATCH), posted: NOW - (b[1] + rnd() * (b[2] - b[1])) * HOUR });
});
for (var j = 0; j < 9; j++) INBOX.push({ score: 0, title: pick(MISS), posted: NOW - rnd() * 300 * HOUR });
INBOX.forEach(function (r, i) {
  r.id = 'in' + i; r.company = pick(CO);
  r.matched = r.score ? (/Site Reliability/.test(r.title) ? 'Site Reliability Engineer' : /DevEx/.test(r.title) ? 'Platform Engineer' : r.title.replace(/,.*$/, '').replace(/^(Staff|Senior) /, '$1 ')) : '';
  r.ghost = (i === 30) ? 'Reposted 4 times in 60 days with the same text' : '';
});
var LAST_VISIT = NOW - 18 * HOUR;
var APPS = [];
function app(status, role, ageDays, extra) {
  var a = { id: 'ap' + APPS.length, status: status, role: role, company: pick(CO), date: iso(NOW - (ageDays + 5) * DAY), updated: iso(NOW - ageDays * DAY),
            fit_score: 0, notes: '', source: 'https://jobs.example.com/' + APPS.length, followup: false, history: [] };
  for (var k in extra) a[k] = extra[k];
  APPS.push(a); return a;
}
app('saved', 'Staff Platform Engineer', 2, { fit_score: 82 });
app('preparing', 'Senior Site Reliability Engineer', 4);
for (var a = 0; a < 15; a++) app('applied', pick(MATCH), [3, 5, 6, 8, 9, 11, 12, 13, 14, 15, 17, 19, 21, 23, 26][a], { followup: a >= 12, fit_score: a === 1 ? 71 : 0 });
app('interviewing', 'Staff Infrastructure Engineer', 6, { fit_score: 77 });
for (var c = 0; c < 86; c++) app(c % 29 === 5 ? 'passed' : 'rejected', pick(rnd() < .8 ? MATCH : MISS), 10 + Math.floor(c * 1.6), { fit_score: c === 9 ? 64 : 0 });
var SAVED_ANSWERS = 3;
var COLS = ['saved', 'preparing', 'applied', 'interviewing', 'offer'];
var COL_LABEL = { saved: 'Saved', preparing: 'Preparing', applied: 'Applied', interviewing: 'Interviewing', offer: 'Offer' };
</script>
<script id="s-app">
var S = { tab: 'pipeline', scn: 'real', w: 'wide', sort: 'newest', hideGhost: false, sel: {}, open: { today: true, week: true, older: false, miss: false },
          stage: {}, closedPage: 0, closedQ: '', closedOut: 'all', lift: null, liftCol: null, dismissed: {}, kept: {}, dOpen: null, dReturn: null, focus: null };
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function ago(ms) { var h = Math.floor((NOW - ms) / HOUR); if (h < 1) return 'just now'; if (h < 24) return h + 'h ago'; return Math.floor(h / 24) + 'd ago'; }
function days(d) { return Math.max(0, Math.floor((NOW - new Date(d + 'T00:00:00Z').getTime()) / DAY)); }
function apps() { return S.scn === 'new' ? [] : APPS; }
function isOpen(a) { return COLS.indexOf(a.status) >= 0; }
function isClosed(a) { return a.status === 'rejected' || a.status === 'passed'; }
function find(id) { for (var i = 0; i < APPS.length; i++) if (APPS[i].id === id) return APPS[i]; return null; }
function findIn(id) { for (var i = 0; i < INBOX.length; i++) if (INBOX[i].id === id) return INBOX[i]; return null; }
function label(s) { return COL_LABEL[s] || (s === 'rejected' ? 'Closed · rejected' : s === 'passed' ? 'Closed · passed' : s); }
function inbox() {
  if (S.scn === 'new') return [];
  return INBOX.filter(function (r) { return !S.dismissed[r.id] && !S.kept[r.id] && (S.scn !== 'quiet' || r.posted < LAST_VISIT); });
}
function announce(msg) { $('live').textContent = ''; setTimeout(function () { $('live').textContent = msg; }, 30); }
var toastTimer = null;
function toast(msg, undo) {
  $('toast-t').textContent = msg; var u = $('toast-undo');
  u.hidden = !undo; u.onclick = function () { $('toast').classList.remove('show'); if (undo) undo(); };
  $('toast').classList.add('show'); clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { $('toast').classList.remove('show'); }, 6000);
}
function visibleById(id) {
  var els = $('cc').querySelectorAll('[data-id="' + id + '"]');
  for (var i = 0; i < els.length; i++) if (els[i].offsetParent !== null) return els[i];
  return null;
}

function render() {
  var ae = document.activeElement, fid = S.focus, fel = null, caret = null;
  if (!fid && ae && $('cc').contains(ae) && !$('drawer').contains(ae)) {
    if (ae.dataset && ae.dataset.id) fid = ae.dataset.id;
    else if (ae.id) { fel = ae.id; caret = ae.selectionEnd; }
  }
  S.focus = null;
  renderToday(); renderTabs(); renderBody();
  if (fid) { var el = visibleById(fid); if (el) el.focus(); }
  else if (fel && $(fel)) { $(fel).focus(); if (caret != null && $(fel).setSelectionRange) $(fel).setSelectionRange(caret, caret); }
}

function renderToday() {
  var el = $('today'), items = [];
  if (S.scn === 'real') {
    var a = apps();
    var fu = a.filter(function (x) { return x.followup && x.status === 'applied'; });
    if (fu.length) {
      var minD = Math.min.apply(null, fu.map(function (x) { return days(x.updated); }));
      items.push({ ic: '⚠', tone: 'warning', t: fu.length + (fu.length === 1 ? ' application has' : ' applications have') + ' had no reply in ' + minD + '+ days', b: 'Review',
                   go: function () { setTab('pipeline'); } });
    }
    a.filter(function (x) { return x.status === 'interviewing'; }).forEach(function (x) {
      items.push({ ic: '●', tone: 'info', t: 'Interviewing: ' + x.role + ' @ ' + x.company + ' · prep not started', b: 'Prep', go: function () { openDrawer(x.id); } });
    });
    var nw = inbox().filter(function (r) { return r.posted > LAST_VISIT; }).length;
    if (nw) items.push({ ic: '✦', tone: 'info', t: nw + ' new ' + (nw === 1 ? 'role' : 'roles') + ' since your last visit (18h ago)', b: 'Triage', go: function () { setTab('inbox'); } });
    var nk = a.filter(function (x) { return x.status === 'saved' || x.status === 'preparing'; });
    if (nk.length) items.push({ ic: '○', tone: 'neutral', t: nk.length + (nk.length === 1 ? ' saved role has' : ' saved or preparing roles have') + ' no apply kit yet', b: 'Build',
                                go: function () { openDrawer(nk[0].id); } });
  }
  if (!items.length) { el.hidden = true; return; }
  el.hidden = false;
  var cap = S.w === 'rail' ? 2 : 3, shown = S.todayAll ? items : items.slice(0, cap), more = items.length - shown.length;
  el.innerHTML = '<h3>Needs you today</h3>' + shown.map(function (it, i) {
    return '<div class="trow"><span aria-hidden="true" style="color:var(--pl-color-status-' + (it.tone === 'neutral' ? 'info' : it.tone) + ')">' + it.ic + '</span>' +
      '<span class="grow">' + esc(it.t) + '</span><button class="pl-btn pl-btn--sm" data-t="' + i + '">' + it.b + '</button></div>';
  }).join('') + (more > 0 ? '<div class="trow"><button class="pl-btn pl-btn--ghost pl-btn--xs" id="today-more">+' + more + ' more</button></div>' : '');
  el.querySelectorAll('[data-t]').forEach(function (b) { b.onclick = function () { shown[+b.dataset.t].go(); }; });
  if ($('today-more')) $('today-more').onclick = function () { S.todayAll = true; renderToday(); };
}

function counts() {
  var a = apps();
  return { pipeline: a.filter(isOpen).length, inbox: inbox().length, closed: a.filter(isClosed).length };
}
function setTab(t) { S.tab = t; S.sel = {}; render(); var b = $('tab-' + t); if (b) b.focus(); }
function renderTabs() {
  var el = $('tabs');
  if (S.scn === 'new') { el.hidden = true; return; }
  el.hidden = false;
  var c = counts(), T = [['pipeline', 'Pipeline'], ['inbox', 'Inbox'], ['closed', 'Closed']];
  el.innerHTML = T.map(function (t) {
    var n = c[t[0]], on = S.tab === t[0];
    return '<button class="tab" role="tab" id="tab-' + t[0] + '" aria-controls="body" aria-selected="' + on + '" tabindex="' + (on ? 0 : -1) + '" data-tab="' + t[0] + '"' +
      ' aria-label="' + t[1] + (n ? ', ' + n : '') + '">' + t[1] + (n ? ' <span class="cnt" aria-hidden="true">' + n + '</span>' : '') + '</button>';
  }).join('');
  el.querySelectorAll('.tab').forEach(function (b, i) {
    b.onclick = function () { setTab(b.dataset.tab); };
    b.onkeydown = function (e) {
      var d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
      if (!d) return; e.preventDefault(); setTab(T[(i + d + T.length) % T.length][0]);
    };
  });
  $('body').setAttribute('aria-labelledby', 'tab-' + S.tab);
}
function renderBody() {
  var b = $('body');
  if (S.scn === 'new') return renderNew(b);
  if (S.tab === 'inbox') return renderInbox(b);
  if (S.tab === 'closed') return renderClosed(b);
  return renderPipeline(b);
}
function renderNew(b) {
  b.innerHTML = '<div class="emptyc pl-empty"><div style="font-size:15px;font-weight:600">Your coach hasn\u2019t started a search yet</div>' +
    '<p class="muted sm" style="max-width:360px;margin:0">Run /setup-coach in chat. It builds your profile, then a watch starts surfacing roles here.</p>' +
    '<button class="pl-btn pl-btn--primary" id="setup">Start setup</button>' +

    '<div>' + a.date + ' \u00b7 Saved from watch</div>' + (a.status !== 'saved' ? '<div>' + a.updated + ' \u00b7 Status \u2192 ' + label(a.status) + '</div>' : '') + '</div></details>';
  showDrawer(esc(a.role), head, body, id);
  $('d-status').onchange = function () { var v = $('d-status').value;
    if (v === 'rejected' || v === 'passed' || COLS.indexOf(v) >= 0) doMove(a, v); };
  $('d-post').onclick = function () { toast('Opens the posting in a new tab (preview: no real link).'); };
  $('d-next').onclick = function () {
    var k = $('d-next').dataset.k;
    if (k === 'reopen') return doMove(a, 'saved');
    toast('Drafted \u201c' + next[1] + ': ' + a.role + ' at ' + a.company + '\u201d into the chat composer. Nothing was sent.');
  };
  if ($('d-more')) {
    $('d-more').onclick = function () { var m = $('d-menu'); m.hidden = !m.hidden; $('d-more').setAttribute('aria-expanded', !m.hidden); if (!m.hidden) m.querySelector('button').focus(); };
    $('d-menu').querySelectorAll('[data-m]').forEach(function (x) { x.onclick = function () { $('d-menu').hidden = true; $('d-more').setAttribute('aria-expanded', 'false'); $('d-more').focus();
      toast('Drafted \u201c' + x.dataset.m + '\u201d into the chat composer. Nothing was sent.'); }; });
  }
  if ($('d-applied')) $('d-applied').onclick = function () { askDialog('Mark ' + a.role + ' at ' + a.company + ' as applied?', [['y', 'Yes', true], [null, 'Cancel']], function (v) { if (v) doMove(a, 'applied'); }); };
  $('d-notes').onblur = function () { if (a.notes !== $('d-notes').value) { a.notes = $('d-notes').value; $('d-saved').textContent = 'Saved'; } };
}
function kitHtml(a) {
  var steps = [['Résumé', 'Tailors your résumé to this posting\u2019s title and requirements.'],
               ['Cover letter', 'Writes one if the posting asks for it, or marks it not needed.'],
               ['Form answers', SAVED_ANSWERS + ' saved answers will be reused; it drafts any new questions for you to confirm.']];
  var open = a.status === 'saved' || a.status === 'preparing';
  return '<details class="grp"' + (open ? ' open' : '') + '><summary><span class="chev">\u203a</span><span class="grow">Apply kit</span><span class="pl-badge">Not started</span></summary>' +
    '<div style="padding:0 12px 12px"><div class="pl-steps">' + steps.map(function (s, i) {
      return '<div class="step pl-step"><span class="n" aria-hidden="true">' + (i + 1) + '</span><div><div style="font-weight:600">' + s[0] + ' <span class="muted sm" style="font-weight:400">\u00b7 Not started</span></div>' +
        '<div class="muted sm">' + s[1] + '</div></div></div>'; }).join('') + '</div>' +
    (open ? '<p class="muted sm" style="margin:8px 0 0">Your coach builds all three in chat. You review each before anything is sent.</p>' : '') +
    (a.status !== 'applied' ? '<div class="toolbar" style="margin:10px 0 0"><button class="pl-btn pl-btn--sm" id="d-applied">I applied already \u2014 mark applied</button></div>' : '') + '</div></details>';
}
function drawerInbox(r) {
  var head = '<div class="muted sm">' + esc(r.company) + ' \u00b7 posted ' + ago(r.posted) + '</div>';
  var body = '<section class="dsec"><h5>Next step</h5><div class="toolbar"><button class="pl-btn pl-btn--primary" id="d-keep">Keep (move to Saved)</button><button class="pl-btn" id="d-dis">Dismiss</button>' +
    '<button class="pl-btn pl-btn--ghost" id="d-post">View posting</button></div></section>' +
    '<section class="dsec"><h5>Why it surfaced</h5><p class="sm" style="margin:0">' + (r.score ? 'Title matches <em>' + esc(r.matched) + '</em>, one of your target roles.' : 'The title doesn\u2019t match your target roles. The watch kept it because the company is on your list.') + '</p>' +
    (r.ghost ? '<p style="margin:8px 0 0"><span class="pl-badge pl-badge--warning">Possible ghost job</span> <span class="muted sm">' + esc(r.ghost) + '</span></p>' : '') + '</section>' +
    '<section class="dsec"><h5>Posting</h5><p class="muted sm" style="margin:0">Invented snippet: you\u2019ll own the platform that runs every service, from build to deploy to observability. Remote within two time zones of UTC.</p></section>';
  showDrawer(esc(r.title), head, body, r.id);
  var nxt = function () { var ids = inbox().map(function (x) { return x.id; }), i = ids.indexOf(r.id); return ids[i + 1] || ids[i - 1]; };
  $('d-keep').onclick = function () { S.dReturn = nxt(); closeDrawer(); inboxAct(r.id, 'keep'); };
  $('d-dis').onclick = function () { S.dReturn = nxt(); closeDrawer(); inboxAct(r.id, 'dismiss'); };
  $('d-post').onclick = function () { toast('Opens the posting in a new tab (preview: no real link).'); };
}
function openAbout() {
  S.dOpen = 'about';
  var prof = S.scn === 'new' ? null : [['Name', 'Alex Example'], ['Target roles', 'Staff / Senior Platform Engineer'], ['Location', 'Remote, UTC\u00b12'], ['Salary floor', 'not recorded'], ['Work history', '8 roles recorded']];
  var body = '<p class="muted sm" style="margin:0">A read-only view. To change anything, tell your coach in chat. Settings live in Settings \u203a Career Coach.</p>' +
    '<details class="grp" open><summary><span class="chev">\u203a</span><span class="grow">What your coach knows about you</span></summary><div style="padding:0 12px 10px" class="sm">' +
    (prof ? prof.map(function (p) { return '<div style="display:flex;gap:12px;padding:3px 0"><span class="muted" style="width:110px;flex:none">' + p[0] + '</span><span' + (p[1] === 'not recorded' ? ' class="muted"><em>' : '>') + p[1] + (p[1] === 'not recorded' ? '</em>' : '') + '</span></div>'; }).join('')
      : '<p class="muted">Nothing recorded yet. Run /setup-coach in chat and it will build this with you.</p>') + '</div></details>' +
    '<details class="grp"><summary><span class="chev">\u203a</span><span class="grow">Fit rubric: how a role is scored</span></summary><div style="padding:0 12px 10px" class="sm">' +
    [['Role match', 35], ['Seniority', 25], ['Location', 20], ['Compensation', 20]].map(function (w) { return '<div style="display:flex;gap:8px;align-items:center;padding:3px 0"><span class="muted" style="width:110px">' + w[0] + '</span><progress class="pl-progress" max="100" value="' + w[1] + '" style="flex:1" aria-label="' + w[0] + ' weight"></progress><span>' + w[1] + '</span></div>'; }).join('') + '</div></details>' +
    '<details class="grp"><summary><span class="chev">\u203a</span><span class="grow">Exactly what it\u2019s told each turn</span></summary><pre class="pl-code-block sm" style="margin:0 12px 12px;white-space:pre-wrap">Candidate: Alex Example (invented)\nTargets: Staff / Senior Platform Engineer, remote</pre></details>';
  showDrawer('About you', '', body, 'about');
}
$('about-btn').onclick = openAbout;
$('d-close').onclick = closeDrawer;
$('scrim').onclick = closeDrawer;
$('drawer').onkeydown = function (e) { if (e.key === 'Escape') { var m = $('d-menu'); if (m && !m.hidden) { m.hidden = true; $('d-more').focus(); } else closeDrawer(); } trap(e, $('drawer')); };
$('pv-scn').onchange = function () { S.scn = $('pv-scn').value; S.tab = 'pipeline'; S.todayAll = false; closeDrawer(); render(); };
$('pv-w').onchange = function () { S.w = $('pv-w').value; var c = $('cc'); c.classList.toggle('rail', S.w === 'rail'); c.classList.toggle('mid', S.w === 'mid'); render(); };
$('pv-th').onchange = function () { var v = $('pv-th').value, r = document.documentElement; if (v) r.setAttribute('data-theme', v); else r.removeAttribute('data-theme'); };
render();
</script>
